name: Collect TikTok views

on:
  schedule:
    - cron: '7 */4 * * *'   # every 4 hours (UTC)
    - cron: '12 8 1 12 *'   # Dec 1 08:12 UTC = Dec 1 00:12 PST, right after the final tally
  workflow_dispatch: {}     # "Run workflow" button for manual runs

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect views
        run: node collector.mjs
        env:
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          COLLECTOR_KEY: ${{ secrets.COLLECTOR_KEY }}
