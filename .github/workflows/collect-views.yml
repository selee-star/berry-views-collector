name: Collect TikTok views

on:
  schedule:
    - cron: '37 10 * * *'   # once a day, 10:37 UTC = 02:37 PST
    - cron: '12 8 1 12 *'   # Dec 1 08:12 UTC = Dec 1 00:12 PST, right after the final tally
    - cron: '12 14,20 1 12 *'   # Dec 1 06:12 and 12:12 PST: finish any final numbers still missing
    - cron: '12 2,14 2,3 12 *'  # Dec 1 18:12 PST ... Dec 3 06:12 PST: same, stops by itself once all are recorded
  workflow_dispatch: {}     # "Run workflow" button for manual runs

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect views
        run: node collector.mjs
        env:
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          COLLECTOR_KEY: ${{ secrets.COLLECTOR_KEY }}
